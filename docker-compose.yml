version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: redpontis-db
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: taskdb
    ports:
      - "3306:3306"
    volumes:
      - redpontis_mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: redpontis-app
    depends_on:
      - db
    environment:
      DB_HOST: db
    ports:
      - "8080:8080"

volumes:
  redpontis_mysql_data: